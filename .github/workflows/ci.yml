name: CI

# Windows and Linux on every pull request, every merge-queue group and every push to main.
# Pull requests and queue groups run whatever they change: main requires these checks, so
# a run skipped for a docs-only change would leave its pull request waiting forever. macOS
# has its own workflow, started by hand for changes that can behave differently there.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "bench/results/**", "conformance/results/**"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token needn't stay in .git/config, where a pull request's code could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      # Java runs only Quint's official route, which the conformance harness compares against.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25.0.5+8
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Fetch Apalache
        run: node node_modules/@informalsystems/quint/dist/src/cli.js verify --backend=tlc --main=reserve3 --invariant=inv conformance/models/reserve.qnt
      # Quint downloads its Rust evaluator through GitHub's API without a token, which a shared runner's rate limit can
      # refuse; it skips the download when the evaluator is already in ~/.quint. The lockfile pins Quint's version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint/rust-evaluator-*
          key: quint-evaluator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun run conformance
      # The package as npm would install it: packed, installed into a new project, run with Node only.
      - name: Package check
        run: node scripts/pack-check.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conformance-${{ matrix.os }}
          path: |
            conformance/results/
            conformance/MATRIX.md
          if-no-files-found: warn
          retention-days: 14
