name: macOS

# Started by hand only, once per pull request whose change can behave differently on macOS
# (processes, signals, paths, the file system, packaging), on its final commit.
on:
  workflow_dispatch:
    inputs:
      bench:
        description: Also run the benchmarks (about 10 more minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    # The check job takes about 15 minutes on Linux at 0.1.0-alpha.1, most of it conformance; the benchmarks add about 10.
    timeout-minutes: ${{ inputs.bench && 40 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token needn't stay in .git/config, where a pull request's code could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      # Java runs only Quint's official route, which the conformance harness compares against.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25.0.5+8
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Quint downloads Apalache 0.62.4 on first use; doing it here keeps that out of the harness's timings.
      - name: Fetch Apalache
        run: node node_modules/@informalsystems/quint/dist/src/cli.js verify --backend=tlc --main=reserve3 --invariant=inv conformance/models/reserve.qnt
      - run: bun run conformance
      # The package as npm would install it: packed, installed into a new project, run with Node only.
      - name: Package check
        run: node scripts/pack-check.mjs
      - name: Benchmarks
        if: inputs.bench
        run: bun bench/run.ts --runs 5
        env:
          QUINT_CHECK_MACHINE: github-macos-15-${{ runner.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-results
          path: |
            conformance/results/
            conformance/MATRIX.md
            bench/results/
            bench/BASELINE.md
          if-no-files-found: warn
          retention-days: 30
