name: Release

# Runs when a v<version> tag is pushed. It builds the package once and tests that tarball, stages that same
# tarball on npm under the alpha dist-tag with provenance, and drafts the GitHub release. The version goes
# live only when a maintainer approves the staged package on npm with 2FA; the draft is published after that.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Node 24.22.1 ships npm 11.18.0: staging needs 11.15.0, and trusted publishing 11.5.1.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - name: The tag names the package's version, as a pre-release
        run: |
          version=$(node -p 'require("./package.json").version')
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
          case "$version" in *-alpha.*) ;; *) echo "only alpha versions are released, under the alpha dist-tag; $version isn't one"; exit 1 ;; esac
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Pack once
        id: pack
        run: |
          mkdir -p release
          tarball=$(npm pack --pack-destination release --silent | tail -n 1)
          (cd release && sha256sum "$tarball" > SHA256SUMS)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      # The tarball that is published, installed into a new project and run with Node only.
      - run: node scripts/pack-check.mjs "release/${{ steps.pack.outputs.tarball }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected: a required reviewer approves before the job can reach npm.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      # Through the package's trusted publisher: the workflow's OIDC identity, with no token.
      - name: Stage the tested tarball on npm
        working-directory: release
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          sha256sum --check SHA256SUMS
          npm stage publish "./$TARBALL" --tag alpha --access public --provenance

  record:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Draft the GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          node -e '
            const text = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const start = text.indexOf(`## [${process.argv[1]}]`);
            if (start < 0) { console.error(`CHANGELOG.md has no section for ${process.argv[1]}`); process.exit(1); }
            const body = text.slice(text.indexOf("\n", start) + 1);
            const end = body.search(/^## \[|^\[[^\]]+\]: /m);
            require("fs").writeFileSync("notes.md", (end < 0 ? body : body.slice(0, end)).trim() + "\n");
          ' "$version"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease --title "quint-check $version" \
            --notes-file notes.md release/*.tgz release/SHA256SUMS
