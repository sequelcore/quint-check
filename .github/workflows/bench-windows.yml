name: Windows benchmark

# Started by hand only. Times quint-check with tla-ts's compile cache warm against the cache off, on one
# hosted runner, with tla-ts alone as a control for the runner's own noise. Hosted runners vary between
# runs, so these timings are compared within a run only, never with a local machine's baseline.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per route, after one warm-up
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: bench-windows
  cancel-in-progress: false

jobs:
  bench:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes, so the token needn't stay in .git/config, where a pull request's code could read it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
      - run: bun install --frozen-lockfile
      # No Java: these routes are quint-check's own, with tla-ts alone as the control.
      - name: Benchmark
        run: bun bench/run.ts --runs ${{ inputs.runs }} --routes quint-check,quint-check-nocache,tla-ts --out-dir results/ci
        env:
          QUINT_CHECK_MACHINE: github-windows-2025-${{ runner.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-windows
          path: bench/results/ci/
          if-no-files-found: warn
          retention-days: 30
